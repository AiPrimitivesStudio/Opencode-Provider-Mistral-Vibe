name: Feature request
description: Suggest an idea for the plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case, not just the feature.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
